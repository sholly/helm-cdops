# Default mount points for the exported dynamic plugin, picked up by Red Hat
# Developer Hub when the plugin is enabled. Override any of this in the
# dynamic-plugins ConfigMap.
dynamicPlugins:
  frontend:
    cdops.plugin-tekton-trigger:
      mountPoints:
        - mountPoint: entity.page.overview/cards
          importName: EntityArgoCdDeployCard
          config:
            layout:
              gridColumnEnd:
                lg: 'span 6'
                md: 'span 8'
                xs: 'span 12'
            if:
              anyOf:
                - hasAnnotation: argocd/app-name
                - hasAnnotation: argocd/app-selector
