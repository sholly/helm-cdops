# Red Hat Developer Hub: load the two exported plugins from tarballs served over
# plain HTTP by an in-cluster registry (examples/openshift/plugin-registry.yaml).
#
# See docs/host-http-plugin-registry.md for the build, pack and hosting steps.
# For the OCI-image equivalent of this file, see docs/install-rhdh.md step 4.
#
# This is the `dynamic-plugins.yaml` shape: paste it into the ConfigMap the
# Backstage CR names, or nest the two entries under `global.dynamic.plugins` in
# Helm values (keeping `global.dynamic.includes`).
#
# Replace, in both entries:
#   - the tarball file names, if `npm pack` printed something different:
#       jq -r .name plugins/*/dist-dynamic/package.json
#   - the sha512 integrity values, from:
#       npm pack --pack-destination /tmp/plugin-registry --json \
#         | jq -r '.[0] | "\(.filename)  \(.integrity)"'
#   - the cluster, ArgoCD and deploy values: URLs, namespaces, the pipeline
#     parameter carrying the version, and the env vars holding the tokens
#
# `integrity` is a hash of the tarball CONTENT and is required for tarballs.
# Never overwrite a published file in place — bump the version so the URL
# changes, or every running install fails with a hash mismatch.
includes:
  # Keep this: dropping it disables every plugin RHDH enables by default.
  - dynamic-plugins.default.yaml
plugins:
  # ---- backend -------------------------------------------------------------
  - package: http://plugin-registry:8080/cdops-plugin-tekton-trigger-backend-dynamic-0.1.0.tgz
    integrity: sha512-REPLACE_ME_BACKEND_HASH
    disabled: false
    pluginConfig:
      tektonTrigger:
        defaultCluster: ocp-dev
        clusters:
          - name: ocp-dev
            url: https://api.ocp-dev.example.com:6443
            # Omit serviceAccountToken when RHDH runs on this cluster: the
            # plugin then reads the projected token at
            # /var/run/secrets/kubernetes.io/serviceaccount/token on every
            # request, so rotation needs no restart.
            dashboardUrl: https://console-openshift-console.apps.ocp-dev.example.com
            dashboardType: openshift
            allowedNamespaces:
              - cdops-ci
              - cdops-build
          - name: ocp-prod
            url: https://api.ocp-prod.example.com:6443
            serviceAccountToken: ${TEKTON_OCP_PROD_TOKEN}
            caData: ${TEKTON_OCP_PROD_CA}
            dashboardUrl: https://console-openshift-console.apps.ocp-prod.example.com
            allowedNamespaces:
              - cdops-release
        pipelineRun:
          serviceAccountName: pipeline
          timeout: 1h0m0s
          labels:
            app.kubernetes.io/part-of: developer-hub
          annotations:
            cdops.com/triggered-from: developer-hub
        deploy:
          # The pipeline must declare this parameter; the plugin sets it to the
          # version picked in the card's dropdown. Per entity:
          # tekton.dev/version-param.
          versionParam: git-revision
          # Passed only when the pipeline declares it.
          appParam: argocd-app
          # Which refs the dropdown offers, newest first.
          includeTags: true
          includeBranches: true
          maxVersions: 50
        maxRuns: 20
      # ArgoCD, in the Roadie config shape. A read-only account is enough: the
      # plugin reads applications and lists repository refs, and never syncs.
      # If the Roadie ArgoCD plugins are already installed in this RHDH, their
      # argocd block is reused and this one can be omitted.
      argocd:
        appLocatorMethods:
          - type: config
            instances:
              - name: main
                url: https://argocd.apps.ocp-dev.example.com
                token: ${ARGOCD_MAIN_TOKEN}

  # ---- frontend ------------------------------------------------------------
  # pluginConfig is REQUIRED here. Without the mount points the Scalprum bundle
  # loads and renders nothing, with no console error.
  - package: http://plugin-registry:8080/cdops-plugin-tekton-trigger-0.1.0.tgz
    integrity: sha512-REPLACE_ME_FRONTEND_HASH
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          cdops.plugin-tekton-trigger:
            mountPoints:
              # The ArgoCD deployment card is the plugin's only frontend
              # extension, and the overview page is already part of RHDH's
              # default entity page, so no entityTabs entry is needed.
              - mountPoint: entity.page.overview/cards
                importName: EntityArgoCdDeployCard
                config:
                  layout:
                    gridColumnEnd:
                      lg: 'span 6'
                      md: 'span 8'
                      xs: 'span 12'
                  if:
                    anyOf:
                      - hasAnnotation: argocd/app-name
                      - hasAnnotation: argocd/app-selector
