# Entity annotations the plugin reads. The backend resolves every request
# against the catalog, so these annotations - not the client - decide which
# pipeline an entity can run.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: policy-api
  description: Policy administration API
  annotations:
    # Required: the Tekton Pipeline to run.
    tekton.dev/pipeline: build-and-deploy

    # Required: namespace holding the pipeline.
    # backstage.io/kubernetes-namespace is used as a fallback.
    tekton.dev/namespace: cdops-ci

    # Optional: which entry in tektonTrigger.clusters to use.
    tekton.dev/cluster: ocp-dev

    # Optional: ServiceAccount the TaskRuns run as.
    tekton.dev/service-account: pipeline

    # Optional: parameter values pinned by the catalog. Users see them in the
    # dialog but cannot change them, and the backend rejects any attempt to.
    tekton.dev/params: |
      {
        "git-url": "https://github.com/cdops/policy-api",
        "image": "image-registry.openshift-image-registry.svc:5000/cdops-ci/policy-api"
      }

    # Optional: workspace bindings passed straight through to spec.workspaces.
    tekton.dev/workspaces: |
      [
        {
          "name": "source",
          "volumeClaimTemplate": {
            "spec": {
              "accessModes": ["ReadWriteOnce"],
              "resources": { "requests": { "storage": "1Gi" } }
            }
          }
        }
      ]
spec:
  type: service
  lifecycle: production
  owner: team-underwriting
---
# Alternative: go through Tekton Triggers instead of creating PipelineRuns.
# The EventListener's TriggerTemplate decides what actually runs.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claims-ui
  annotations:
    tekton.dev/event-listener: cdops-el
    tekton.dev/namespace: cdops-ci
    # Still useful: lets the UI list the runs the EventListener creates.
    tekton.dev/pipeline: build-and-deploy
spec:
  type: website
  lifecycle: production
  owner: team-claims
