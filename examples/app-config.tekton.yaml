# Configuration for the tekton-trigger backend plugin.
#
# Merge this into app-config.yaml (or app-config.local.yaml for local dev).
# Everything secret is read from the environment so nothing lands in git.
tektonTrigger:
  # Used when an entity has no tekton.dev/cluster annotation.
  defaultCluster: ocp-dev

  clusters:
    - name: ocp-dev
      url: https://api.ocp-dev.example.com:6443
      # ServiceAccount token from examples/openshift/rbac.yaml.
      # Omit both token options when Developer Hub runs on the same cluster:
      # the plugin then reads the projected token at
      # /var/run/secrets/kubernetes.io/serviceaccount/token.
      serviceAccountToken: ${TEKTON_OCP_DEV_TOKEN}
      # base64-encoded PEM bundle, e.g. the router-ca or an internal CA.
      caData: ${TEKTON_OCP_DEV_CA}
      # Deep links in the UI point here.
      dashboardUrl: https://console-openshift-console.apps.ocp-dev.example.com
      dashboardType: openshift
      # Defence in depth: entities may only point at these namespaces.
      allowedNamespaces:
        - cdops-ci
        - cdops-build

    - name: ocp-prod
      url: https://api.ocp-prod.example.com:6443
      serviceAccountToken: ${TEKTON_OCP_PROD_TOKEN}
      caData: ${TEKTON_OCP_PROD_CA}
      dashboardUrl: https://console-openshift-console.apps.ocp-prod.example.com
      allowedNamespaces:
        - cdops-release

  # Optional: entities annotated with tekton.dev/event-listener fire these
  # instead of creating a PipelineRun directly.
  eventListeners:
    - name: cdops-el
      url: https://el-cdops-ci.apps.ocp-dev.example.com
      secret: ${TEKTON_EVENT_LISTENER_SECRET}
      secretHeader: X-Backstage-Token
      cluster: ocp-dev
      namespace: cdops-ci

  # Applied to every PipelineRun the plugin creates.
  pipelineRun:
    serviceAccountName: pipeline
    timeout: 1h0m0s
    labels:
      app.kubernetes.io/part-of: developer-hub
    annotations:
      cdops.com/triggered-from: developer-hub

  # How a version picked in the ArgoCD card reaches the pipeline.
  deploy:
    # The pipeline must declare this parameter. The plugin sets it to the
    # picked git version; the pipeline is what writes that version into the
    # manifests ArgoCD watches. Per entity: tekton.dev/version-param.
    versionParam: git-revision
    # Passed only when the pipeline declares it, so a pipeline that handles
    # one application does not have to take it.
    appParam: argocd-app
    # Which refs the dropdown offers, newest first.
    includeTags: true
    includeBranches: true
    # Optional: hide pre-releases and anything that is not a release tag.
    tagPattern: '^v\d+\.\d+\.\d+$'
    maxVersions: 50

  # Runs listed per entity.
  maxRuns: 20

# ArgoCD access. This is the Roadie ArgoCD config shape, read through
# argocdServiceRef: if the Roadie ArgoCD plugins are already installed, this
# plugin reuses their instances and needs nothing extra here.
argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: main
          url: https://argocd.apps.ocp-dev.example.com
          # Either a long-lived API token for a local ArgoCD account...
          token: ${ARGOCD_MAIN_TOKEN}
          # ...or username/password, which the service exchanges for a session
          # token per request:
          # username: ${ARGOCD_MAIN_USERNAME}
          # password: ${ARGOCD_MAIN_PASSWORD}

# Optional: gate reading and deploying behind the permission framework. Without
# a policy every authenticated user who can see the entity may deploy it.
permission:
  enabled: true
