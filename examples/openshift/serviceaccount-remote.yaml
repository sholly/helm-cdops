# A dedicated ServiceAccount with a long-lived token, for when RHDH runs on a
# DIFFERENT cluster from the pipelines and so has no projected token to use.
#
# Prefer rolebinding-rhdh.yaml when RHDH is on this cluster - it needs no Secret.
#
# tektonTrigger.clusters[].serviceAccountToken is a SINGLE value per cluster,
# while allowedNamespaces may list several namespaces. So create exactly ONE
# ServiceAccount, in one namespace, and bind it in each of the others. Applying
# this file to several namespaces would create several ServiceAccounts, each
# with its own token, and only one of them could ever be configured.
#
#   # 1. the Role, in every pipeline namespace
#   for ns in cdops-release cdops-build; do
#     oc apply -n "$ns" -f examples/openshift/rbac.yaml
#   done
#
#   # 2. the ServiceAccount, its token and its binding, in ONE of them
#   SA_NS=cdops-release
#   sed "s|REPLACE_SERVICEACCOUNT_NAMESPACE|$SA_NS|" \
#     examples/openshift/serviceaccount-remote.yaml | oc apply -n "$SA_NS" -f -
#
#   # 3. bind that same ServiceAccount in every OTHER pipeline namespace
#   for ns in cdops-build; do
#     oc create rolebinding developer-hub-tekton \
#       --role=developer-hub-tekton \
#       --serviceaccount="$SA_NS:developer-hub-tekton" \
#       -n "$ns"
#   done
#
#   # 4. verify, per namespace - must print `yes`
#   oc auth can-i create pipelineruns.tekton.dev -n cdops-build \
#     --as="system:serviceaccount:$SA_NS:developer-hub-tekton"
#
# Then read the token and the API server CA out for the RHDH pod's environment.
# `caData` is base64-encoded PEM, so the cert is base64'd once more than the raw
# value - see docs/install-rhdh.md step 4a:
#
#   oc get secret developer-hub-tekton-token -n "$SA_NS" \
#     -o jsonpath='{.data.token}' | base64 -d
#   oc get secret developer-hub-tekton-token -n "$SA_NS" \
#     -o jsonpath='{.data.ca\.crt}'
#
# The second command returns the value already base64-encoded, which is exactly
# what caData wants. It verifies the API server only when the cluster uses its
# default serving certificate; with a custom
# apiServer.spec.servingCerts.namedCertificates you need that issuer's CA
# instead.
#
# No namespace is set on any object, so `oc apply -n` decides where they land.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-hub-tekton
  labels:
    app.kubernetes.io/part-of: developer-hub
---
# Binds the Role from rbac.yaml in this namespace to the ServiceAccount above.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-tekton
  labels:
    app.kubernetes.io/part-of: developer-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-hub-tekton
subjects:
  - kind: ServiceAccount
    name: developer-hub-tekton
    # Required for a ServiceAccount subject, and must be the namespace this
    # file is applied to.
    namespace: REPLACE_SERVICEACCOUNT_NAMESPACE
---
# A non-expiring token for the ServiceAccount above.
#
# Since OpenShift 4.11 / Kubernetes 1.24, creating a ServiceAccount no longer
# creates a token Secret for it - but the token controller still populates one
# you declare yourself, which is why this object is here. Use this rather than
# `oc create token`, which issues a time-bound token (one hour by default) and
# so cannot be pinned into static config.
#
# Treat the populated value as a credential: it does not expire, and revoking it
# means deleting this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: developer-hub-tekton-token
  annotations:
    kubernetes.io/service-account.name: developer-hub-tekton
  labels:
    app.kubernetes.io/part-of: developer-hub
type: kubernetes.io/service-account-token
