nodeLinker: node-modules

# @material-ui/core@4 declares `react: ^16.8 || ^17` while the @backstage/*
# packages require `^17 || ^18`, so no single React (or @types/react) version
# satisfies every requester and Yarn reports YN0060 on each install. React 18
# works with MUI v4 at runtime, and this is the same pairing Backstage itself
# ships in @backstage/core-components.
logFilters:
  - code: YN0060
    level: discard

yarnPath: .yarn/releases/yarn-4.18.1.cjs
